[project]
name = "football"
version = "0.1.0"
description = "Weekly NFL game winner predictor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "lxml>=5.3",
    "nflreadpy>=0.1.5",
    "numpy>=2.0",
    "polars>=1.20",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "timezonefinder>=6.5",
    "typer>=0.15",
]

[project.scripts]
football = "football.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football"]

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the network"]
addopts = "-m 'not network'"
